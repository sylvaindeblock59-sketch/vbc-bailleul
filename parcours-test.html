<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#0f2438;display:flex;justify-content:center;padding:14px;font-family:system-ui,sans-serif}
.box{max-width:440px;width:100%}
.banner{background:#b91c1c;color:#fff;font-size:17px;font-weight:900;text-align:center;padding:10px;border-radius:10px;margin-bottom:8px;display:none}
.chrono{color:#fbbf24;font-size:17px;font-weight:900;text-align:center;margin-top:12px}
.step{color:#fff;font-size:22px;font-weight:900;text-align:center;margin-top:8px;min-height:56px;line-height:1.15}
.phase{color:#93c5fd;font-size:15px;font-weight:600;text-align:center;margin-top:6px;min-height:20px}
.pass{display:inline-block;background:#1d3a5f;color:#fbbf24;font-size:14px;font-weight:800;padding:5px 14px;border-radius:12px;margin-top:6px}
</style></head><body>
<div class="box">
<div class="banner" id="banner">⏸ Après 1m30 de récupération,<br>2e passage</div>
<div style="text-align:center"><span class="pass" id="pass">PASSAGE 1 / 2</span></div>
<svg viewBox="0 0 420 400" style="width:100%;background:#16324f;border-radius:14px;margin-top:8px">
  <polygon points="210,42 219,62 201,62" fill="#8b5cf6"/><text x="210" y="35" fill="#fff" font-size="15" text-anchor="middle" font-weight="800">N6</text>
  <line x1="210" y1="62" x2="210" y2="188" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="227" y="128" fill="#94a3b8" font-size="11">5 m</text>
  <polygon points="60,183 69,203 51,203" fill="#22c55e"/><text x="60" y="176" fill="#fff" font-size="14" text-anchor="middle" font-weight="800">N3</text>
  <polygon points="135,183 144,203 126,203" fill="#ef4444"/><text x="135" y="176" fill="#fff" font-size="14" text-anchor="middle" font-weight="800">N1</text>
  <circle cx="210" cy="193" r="16" fill="#1d3a5f" stroke="#fff" stroke-width="2.5"/><text x="210" y="198" fill="#fff" font-size="13" text-anchor="middle" font-weight="900">D</text>
  <polygon points="285,183 294,203 276,203" fill="#f59e0b"/><text x="285" y="176" fill="#fff" font-size="14" text-anchor="middle" font-weight="800">N2</text>
  <polygon points="360,183 369,203 351,203" fill="#3b82f6"/><text x="360" y="176" fill="#fff" font-size="14" text-anchor="middle" font-weight="800">N4</text>
  <text x="97" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">2m</text>
  <text x="172" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">2m</text>
  <text x="247" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">2m</text>
  <text x="322" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">2m</text>
  <line x1="210" y1="208" x2="210" y2="330" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="227" y="270" fill="#94a3b8" font-size="11">4 m</text>
  <polygon points="210,330 219,350 201,350" fill="#8b5cf6"/><text x="210" y="368" fill="#fff" font-size="15" text-anchor="middle" font-weight="800">N5</text>

  <g id="jumper" opacity="1">
    <circle cx="210" cy="148" r="10" fill="#fbbf24" stroke="#fff" stroke-width="2.5"/>
    <line x1="210" y1="158" x2="210" y2="177" stroke="#fbbf24" stroke-width="4"/>
    <line x1="210" y1="162" x2="200" y2="171" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="210" y1="162" x2="220" y2="171" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="210" y1="177" x2="202" y2="190" stroke="#fbbf24" stroke-width="3.5"/>
    <line x1="210" y1="177" x2="218" y2="190" stroke="#fbbf24" stroke-width="3.5"/>
    <path id="rope" d="M 200,171 Q 210,197 220,171" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="translate" dur="0.4s" repeatCount="indefinite" values="0,0; 0,-9; 0,0"/>
  </g>

  <circle id="ball" r="11" fill="#fbbf24" stroke="#fff" stroke-width="3" opacity="0">
    <animateMotion id="mo" dur="46s" repeatCount="indefinite" calcMode="linear" begin="indefinite"
      keyTimes="0.0;0.039;0.0781;0.1171;0.1562;0.1952;0.2343;0.2733;0.3124;0.3514;0.3905;0.4295;0.4686;0.5076;0.5467;0.5857;0.6248;0.6638;0.7029;0.7419;0.781;0.82;1.0"
      keyPoints="0.0;0.0214;0.0641;0.1281;0.1922;0.2349;0.299;0.363;0.4058;0.4698;0.5339;0.5766;0.6407;0.6834;0.7224;0.7614;0.8004;0.8394;0.8796;0.9197;0.9599;1.0;1.0"
      path="M 210,193 L 135,193 L 285,193 L 60,193 L 285,193 L 135,193 L 360,193 L 135,193 L 285,193 L 60,193 L 285,193 L 135,193 L 360,193 L 210,193 L 210,330 L 210,193 L 210,330 L 210,193 L 210,52 L 210,193 L 210,52 L 210,193"/>
  </circle>
</svg>
<div class="chrono" id="chrono">⏱ 0.0 s</div>
<div class="step" id="lbl">🪢 CORDE À SAUTER<br>pieds joints · 30 sec</div>
<div class="phase" id="ph">Lance ton chrono maintenant</div>
</div>
<script>
const rope=document.getElementById('rope');
let rp=0;
setInterval(()=>{rp=(rp+1)%2;rope.setAttribute('d',rp?'M 200,171 Q 210,148 220,171':'M 200,171 Q 210,197 220,171');},200);

// Vertical : D->N5->D->N5->D->N6->D->N6(sprint), sur l'axe vertical UNIQUEMENT
// keyPoints le long du path ; le path se termine par les allers-retours verticaux
const CY=46;
const seq=[
 [0,   "🪢 CORDE À SAUTER<br>pieds joints · 30 sec","Lance ton chrono maintenant","corde"],
 [8,   "D → N1 → N2 → N3","1er passage horizontal","run"],
 [13,  "N3 → N2 → N1 → N4","retour 1er passage","run"],
 [18,  "N4 → N1 → N2 → N3","2e passage horizontal","run"],
 [24,  "N3 → N2 → N1 → N4 → D","fin horizontal","run"],
 [29,  "D → N5 → D → N5","VERTICAL · courses av/arr","run"],
 [34,  "D → N6 → D → N6","VERTICAL","run"],
 [38,  "→ N6 : SPRINT FINAL","🔥 MAXIMAL","run"],
 [40,  "🫀 Note TEMPS + PULSATIONS","fin du passage","mesure"],
 [41,  "⏸ Récup 1m30 puis 2e passage","","banner"]
];
const chrono=document.getElementById('chrono'),lbl=document.getElementById('lbl'),ph=document.getElementById('ph');
const jm=document.getElementById('jumper'),bl=document.getElementById('ball'),mo=document.getElementById('mo'),pass=document.getElementById('pass'),banner=document.getElementById('banner');
let started=false;
function tick(){
  const gt=performance.now()/1000, t=gt%CY;
  if(t<8){ bl.setAttribute('opacity','0'); jm.setAttribute('opacity','1'); started=false; }
  else { jm.setAttribute('opacity','0'); bl.setAttribute('opacity','1');
    if(!started){ mo.setAttribute('begin',gt.toFixed(2)+'s'); try{mo.beginElement();}catch(e){} started=true; } }
  // chrono démarre dès la corde (t=0)
  let ct=(t<40)?t:40;
  chrono.textContent='⏱ '+ct.toFixed(1)+' s';
  chrono.style.color=(t>=40&&t<46)?'#22c55e':'#fbbf24';
  let cur=seq[0]; for(const s of seq){ if(t>=s[0]) cur=s; }
  lbl.innerHTML=cur[1]; ph.textContent=cur[2];
  banner.style.display=(cur[3]==='banner')?'block':'none';
  pass.textContent='PASSAGE '+((Math.floor(gt/CY)%2)+1)+' / 2';
  requestAnimationFrame(tick);
}
tick();
</script>
</body></html>
